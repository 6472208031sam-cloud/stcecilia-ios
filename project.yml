# xcodegen project spec — generates StCecilia.xcodeproj on the CI runner.
# (`brew install xcodegen && xcodegen generate`)
name: StCecilia
options:
  bundleIdPrefix: io.github
  deploymentTarget:
    iOS: "15.0"
targets:
  StCecilia:
    type: application
    platform: iOS
    sources:
      - path: StCecilia/Sources
    info:
      path: StCecilia/Info.plist
      properties:
        CFBundleDisplayName: St Cecilia v2
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "St Cecilia uses your location while you drive so it can alert you as you reach each bus stop."
        NSLocationAlwaysAndWhenInUseUsageDescription: "St Cecilia tracks your ride in the background so stop alerts keep working when the screen is off or the app is minimized."
        UIBackgroundModes: [location, audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stcecilia
        SWIFT_VERSION: "5.0"
